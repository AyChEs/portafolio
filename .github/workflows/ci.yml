name: CI
on:
  push:
    branches: [main, claude/zealous-franklin-er41ad, plan/cierre]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run audit
      - run: npm run lhci
      - run: npm run lhci:mobile
